nodeLinker: node-modules
networkConcurrency: 1
httpTimeout: 300000

# Expo still publishes SDK 58 patches inside the 24h age gate.
# react-native-safe-area-context 5.11.1 is the SDK 58.0.23 pin (2026-11-03).
# @data-client is our own library; its betas are tested here the day they publish.
npmPreapprovedPackages:
  - "expo"
  - "expo-*"
  - "@expo/*"
  - "babel-preset-expo"
  - "jest-expo"
  - "react-native-safe-area-context"
  - "@data-client/*"
